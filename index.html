<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rec Report - v1.8.1</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #05edf5;
      --primary-dark: #029aaa;
      --text: #222222;
      --border: #cccccc;
      --danger: #ff4d4d;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
    }

    .version-tag {
      background-color: #e0e0e0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #000;
    }

    .btn-primary:hover {
      background-color: var(--primary-dark);
      color: #fff;
    }

    .btn-cancel {
      background-color: #888888;
      color: #fff;
    }

    .btn-danger {
      background-color: var(--danger);
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #f0f0f0;
    }

    .status-badge {
      font-size: 0.85rem;
      color: #008000;
      font-weight: bold;
    }

    .status-badge.offline {
      color: var(--danger);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h2>Rec Report</h2>
      <div>
        <span id="connection-status" class="status-badge">Initializing Firebase...</span>
        <span class="version-tag">v1.8.1</span>
      </div>
    </header>

    <!-- Form Section -->
    <div class="card">
      <h3 id="form-title">Add New Record</h3>
      <form id="rec-form">
        <input type="hidden" id="record-id">
        
        <div class="form-group">
          <label for="title">Title / Item Name</label>
          <input type="text" id="title" required placeholder="e.g. Vehicle Inspection Report">
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <input type="text" id="category" placeholder="e.g. Maintenance, Research, Log">
        </div>

        <div class="form-group">
          <label for="notes">Notes & Details</label>
          <textarea id="notes" rows="4" placeholder="Enter record details..."></textarea>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn-primary" id="save-btn">Save Record</button>
          <button type="button" class="btn-cancel" id="cancel-btn" style="display: none;" onclick="resetForm()">Cancel Edit</button>
        </div>
      </form>
    </div>

    <!-- Records Table -->
    <div class="card">
      <h3>Saved Cloud Records</h3>
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Notes</th>
            <th>Last Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="records-body">
          <tr>
            <td colspan="5">Loading records from Firebase...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Firebase v9+ SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      doc, 
      onSnapshot, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // -------------------------------------------------------------
    // Firebase Configuration
    // Replace the placeholders below with your project credentials
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const collectionRef = collection(db, "rec_reports");

    const statusBadge = document.getElementById("connection-status");
    const recordsBody = document.getElementById("records-body");
    const recForm = document.getElementById("rec-form");

    // Real-Time Cloud Listener
    onSnapshot(collectionRef, (snapshot) => {
      statusBadge.textContent = "● Online (Firebase Active)";
      statusBadge.classList.remove("offline");

      if (snapshot.empty) {
        recordsBody.innerHTML = `<tr><td colspan="5">No records found. Create one above!</td></tr>`;
        return;
      }

      recordsBody.innerHTML = "";
      
      snapshot.docs.forEach((document) => {
        const data = document.data();
        const id = document.id; // Capture Firestore Document ID
        
        const row = document.createElement("tr");
        
        const dateFormatted = data.updatedAt 
          ? new Date(data.updatedAt.toDate()).toLocaleString() 
          : "Just now";

        row.innerHTML = `
          <td><strong>${escapeHtml(data.title || '')}</strong></td>
          <td>${escapeHtml(data.category || '')}</td>
          <td>${escapeHtml(data.notes || '')}</td>
          <td><small>${dateFormatted}</small></td>
          <td>
            <button class="btn-primary" onclick="editRecord('${id}', \`${escapeQuotes(data.title)}\`, \`${escapeQuotes(data.category)}\`, \`${escapeQuotes(data.notes)}\`)">Edit</button>
            <button class="btn-danger" onclick="deleteRecord('${id}')">Delete</button>
          </td>
        `;
        recordsBody.appendChild(row);
      });
    }, (error) => {
      console.error("Firestore subscription error:", error);
      statusBadge.textContent = "● Offline / Connection Error";
      statusBadge.classList.add("offline");
      recordsBody.innerHTML = `<tr><td colspan="5" style="color: red;">Failed to load records. Check API keys and security rules.</td></tr>`;
    });

    // Form Submit Handler (Handles both Create and Update)
    recForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const recordId = document.getElementById("record-id").value;
      const title = document.getElementById("title").value;
      const category = document.getElementById("category").value;
      const notes = document.getElementById("notes").value;

      const recordData = {
        title,
        category,
        notes,
        updatedAt: serverTimestamp()
      };

      try {
        if (recordId) {
          // UPDATE EXISTING RECORD
          const docRef = doc(db, "rec_reports", recordId);
          await updateDoc(docRef, recordData);
          console.log("Record updated:", recordId);
        } else {
          // CREATE NEW RECORD
          await addDoc(collectionRef, recordData);
          console.log("New record added");
        }

        resetForm();
      } catch (error) {
        console.error("Error saving record to Firebase:", error);
        alert("Error saving changes. Check browser console for details.");
      }
    });

    // Edit Button Action
    window.editRecord = (id, title, category, notes) => {
      document.getElementById("record-id").value = id;
      document.getElementById("title").value = title;
      document.getElementById("category").value = category;
      document.getElementById("notes").value = notes;

      document.getElementById("form-title").textContent = "Edit Record";
      document.getElementById("save-btn").textContent = "Update Record";
      document.getElementById("cancel-btn").style.display = "inline-block";
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // Delete Action
    window.deleteRecord = async (id) => {
      if (confirm("Are you sure you want to delete this record?")) {
        try {
          await deleteDoc(doc(db, "rec_reports", id));
        } catch (error) {
          console.error("Error deleting record:", error);
        }
      }
    };

    // Reset Form UI State
    window.resetForm = () => {
      document.getElementById("record-id").value = "";
      recForm.reset();
      document.getElementById("form-title").textContent = "Add New Record";
      document.getElementById("save-btn").textContent = "Save Record";
      document.getElementById("cancel-btn").style.display = "none";
    };

    // Helper utilities for HTML escaping
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    function escapeQuotes(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
