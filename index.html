<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Research Hub v1.8.3</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase v10 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      background-color: #0b1329;
      color: #94a3b8;
    }
    .table-container {
      background-color: #0f172a;
      border: 1px solid #1e293b;
    }
    th {
      background-color: #0b1329;
      color: #94a3b8;
    }
    tr {
      border-bottom: 1px solid #1e293b;
    }
    tr:hover {
      background-color: #1e293b/50;
    }
  </style>
</head>
<body class="min-h-screen text-slate-300 font-sans pb-12">

  <!-- Header / Navigation Bar -->
  <header class="bg-[#0b1329] border-b border-slate-800 py-4 px-6 mb-6">
    <div class="max-w-[1600px] mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 p-2 rounded-lg text-white">
          <i class="fa-solid fa-car text-xl"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold text-white tracking-tight">Vehicle Research Hub</h1>
            <span class="bg-blue-900/60 text-blue-400 text-xs px-2 py-0.5 rounded font-mono font-semibold border border-blue-700/50">v1.8.3</span>
          </div>
          <p class="text-xs text-slate-400 mt-0.5">CarMax Inventory Reconciliation & Real-Time Lot Inspection</p>
        </div>
      </div>

      <!-- Action Tabs & Mode Status -->
      <div class="flex items-center gap-3">
        <div class="bg-slate-900/80 p-1 rounded-lg border border-slate-800 flex items-center gap-1">
          <button class="bg-blue-600 text-white px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-border-all"></i> Interactive App
          </button>
          <button class="text-slate-400 hover:text-slate-200 px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition">
            <i class="fa-solid fa-file-lines"></i> Reports
          </button>
          <button class="text-slate-400 hover:text-slate-200 px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition">
            <i class="fa-solid fa-tags"></i> Manage Tags
          </button>
        </div>

        <div id="sync-status" class="bg-slate-900/90 text-xs text-emerald-400 border border-emerald-900/50 px-3 py-1.5 rounded-lg flex items-center gap-2 font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" id="status-indicator"></span>
          <span id="status-text">Live Cloud Sync Active</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-[1600px] mx-auto px-6">

    <!-- Search & Control Toolbar -->
    <div class="bg-[#0f172a] p-4 rounded-xl border border-slate-800 mb-6 flex flex-col lg:flex-row justify-between items-center gap-4">
      <div class="relative flex-1 w-full">
        <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-500 text-sm"></i>
        <input type="text" id="search-input" placeholder="Search stock #, year, description, VIN, location, status, tag, or notes..." class="w-full pl-10 pr-4 py-2 bg-[#0b1329] border border-slate-800 rounded-lg text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
      </div>

      <div class="flex items-center gap-3 w-full lg:w-auto justify-end flex-wrap">
        <select id="code-filter" class="bg-[#0b1329] border border-slate-800 text-slate-300 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
          <option value="ALL">All Research Tags</option>
          <option value="Unassigned">Unassigned</option>
          <option value="Priority Lead">Priority Lead</option>
          <option value="Needs Inspection">Needs Inspection</option>
          <option value="Pending Review">Pending Review</option>
          <option value="Hold">Hold</option>
          <option value="Archive">Archive</option>
        </select>

        <button onclick="resetOrder()" class="bg-[#0b1329] hover:bg-slate-800 text-slate-300 border border-slate-800 px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1.5 transition">
          <i class="fa-solid fa-rotate-left text-xs"></i> Reset Order
        </button>

        <button onclick="resetData()" class="bg-[#0b1329] hover:bg-slate-800 text-slate-300 border border-slate-800 px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1.5 transition">
          <i class="fa-solid fa-arrows-rotate text-xs"></i> Reset Data
        </button>

        <button onclick="exportJSON()" class="bg-blue-600/10 hover:bg-blue-600/20 text-blue-400 border border-blue-500/30 px-3.5 py-2 rounded-lg text-sm font-medium flex items-center gap-1.5 transition">
          <i class="fa-solid fa-download text-xs"></i> Export JSON
        </button>
      </div>
    </div>

    <!-- Table Meta Summary -->
    <div class="flex justify-between items-center text-xs text-slate-400 mb-3 px-1">
      <div>
        Showing <span id="vehicle-count" class="font-bold text-white">0</span> vehicles
        <span class="ml-2 bg-slate-800 text-slate-300 px-2 py-0.5 rounded text-[11px]" id="sort-indicator">Sort: Original Order</span>
      </div>
      <div class="text-slate-500 italic">
        <i class="fa-solid fa-arrow-down-up-across-line mr-1"></i> Click table headers to sort
      </div>
    </div>

    <!-- Data Table Container -->
    <div class="table-container rounded-xl overflow-hidden shadow-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="text-slate-400 font-semibold border-b border-slate-800 uppercase tracking-wider text-[11px]">
              <th class="py-3 px-4 w-12 text-center">#</th>
              <th class="py-3 px-4 cursor-pointer hover:text-white" onclick="sortTable('stockNum')">STOCK #</th>
              <th class="py-3 px-4 cursor-pointer hover:text-white" onclick="sortTable('year')">YEAR</th>
              <th class="py-3 px-4 cursor-pointer hover:text-white" onclick="sortTable('vehicleDescription')">DESCRIPTION</th>
              <th class="py-3 px-4 cursor-pointer hover:text-white" onclick="sortTable('lastScanLocation')">LOCATION</th>
              <th class="py-3 px-4 cursor-pointer hover:text-white" onclick="sortTable('zoneDescription')">ZONE</th>
              <th class="py-3 px-4 cursor-pointer hover:text-white" onclick="sortTable('vin')">VIN</th>
              <th class="py-3 px-4 cursor-pointer hover:text-white" onclick="sortTable('productStatus')">STATUS</th>
              <th class="py-3 px-4 cursor-pointer hover:text-white" onclick="sortTable('code')">RESEARCH TAG</th>
              <th class="py-3 px-4 cursor-pointer hover:text-white" onclick="sortTable('modifiedDate')">MODIFIED</th>
              <th class="py-3 px-4 text-center">ACTIONS</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Dynamic tabular vehicle rows render here -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Edit Research Notes Modal -->
  <div id="edit-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-[#0f172a] rounded-xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-800">
      <div class="bg-[#0b1329] px-6 py-4 flex justify-between items-center border-b border-slate-800">
        <h3 class="font-bold text-white text-base flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-blue-400"></i> Edit Research Tag & Comments
        </h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="p-6 space-y-4">
        <div>
          <p id="modal-vehicle-title" class="font-bold text-slate-100 text-sm"></p>
          <p id="modal-stock-num" class="text-xs font-mono text-slate-400 mt-0.5"></p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Research Tag</label>
          <select id="modal-code" class="w-full py-2 px-3 text-sm bg-[#0b1329] border border-slate-800 rounded-lg text-slate-200 focus:outline-none focus:border-blue-500">
            <option value="Unassigned">Unassigned</option>
            <option value="Priority Lead">Priority Lead</option>
            <option value="Needs Inspection">Needs Inspection</option>
            <option value="Pending Review">Pending Review</option>
            <option value="Hold">Hold</option>
            <option value="Archive">Archive</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Comments & Inspection Notes</label>
          <textarea id="modal-comments" rows="4" placeholder="Enter comments or inspection notes..." class="w-full p-3 text-sm bg-[#0b1329] border border-slate-800 rounded-lg text-slate-200 focus:outline-none focus:border-blue-500 placeholder-slate-600"></textarea>
        </div>
      </div>

      <div class="bg-[#0b1329] px-6 py-3 flex justify-end gap-3 border-t border-slate-800">
        <button onclick="closeEditModal()" class="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-slate-200 transition">Cancel</button>
        <button onclick="saveVehicleNotes()" class="px-4 py-2 text-xs font-semibold bg-blue-600 text-white rounded-lg hover:bg-blue-500 shadow-sm transition">Save Changes</button>
      </div>
    </div>
  </div>

        {"stockNum":"29176316","year":"2020","vehicleDescription":"VOLVO XC60 PLUG-IN HYBRID 4D SPORT UTILIT","lastScanDate":"9/21/26","lastScanLocation":"WZA153","zoneDescription":"WHOLESALE ZONE A","daysInZone":"0","color":"GRAY","vin":"YV4BK0DP2L1468169","productStatus":"SOLD WHOLESALE","daysInStatus":"0","reportSection":"INCORRECT PROD STATUS FOR ZONE - SOLD VEHICLES","comments":"","code":"Unassigned","originalIndex":38,"id":"29176316","modifiedDate":"Sep 21, 08:00 AM"}
      ]
    };

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "YOUR_ACTUAL_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch (e) {
      console.warn("Firebase not configured. Operating in Local Cache mode.", e);
    }

    let vehiclesState = [];
    let activeSortKey = null;
    let activeSortAsc = true;
    let activeEditingStockNum = null;

    // Initialize Store
    function initDataStore() {
      const localData = localStorage.getItem('carmax_vehicle_research_v1.7.4');
      vehiclesState = localData ? JSON.parse(localData).vehicles : seedDataset.vehicles;

      if (db) {
        db.collection("vehicles").onSnapshot((snapshot) => {
          document.getElementById('status-indicator').className = "w-2 h-2 rounded-full bg-emerald-500";
          document.getElementById('status-text').innerText = "Live Cloud Sync Active";

          if (!snapshot.empty) {
            snapshot.forEach((doc) => {
              const remoteData = doc.data();
              const localIndex = vehiclesState.findIndex(v => String(v.stockNum) === String(doc.id));
              if (localIndex !== -1) {
                vehiclesState[localIndex].comments = remoteData.comments !== undefined ? remoteData.comments : vehiclesState[localIndex].comments;
                vehiclesState[localIndex].code = remoteData.code || vehiclesState[localIndex].code;
                vehiclesState[localIndex].modifiedDate = remoteData.modifiedDate || vehiclesState[localIndex].modifiedDate;
              }
            });
            saveLocalCache();
            renderTable();
          }
        }, (error) => {
          console.error("Firestore error:", error);
          document.getElementById('status-indicator').className = "w-2 h-2 rounded-full bg-amber-500";
          document.getElementById('status-text').innerText = "Local Cache Mode";
        });
      } else {
        document.getElementById('status-indicator').className = "w-2 h-2 rounded-full bg-amber-500";
        document.getElementById('status-text').innerText = "Local Cache Mode";
      }

      renderTable();
    }

    function saveLocalCache() {
      localStorage.setItem('carmax_vehicle_research_v1.7.4', JSON.stringify({
        tags: seedDataset.tags,
        vehicles: vehiclesState
      }));
    }

    // Render Tabular Layout matching v1.7.4
    function renderTable() {
      const tbody = document.getElementById('table-body');
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const codeFilter = document.getElementById('code-filter').value;

      let filtered = vehiclesState.filter(v => {
        const fullText = `${v.stockNum} ${v.year} ${v.vehicleDescription} ${v.lastScanLocation} ${v.zoneDescription} ${v.vin} ${v.productStatus} ${v.code} ${v.comments}`.toLowerCase();
        const matchesSearch = fullText.includes(searchTerm);
        const matchesCode = (codeFilter === 'ALL') || (v.code === codeFilter);
        return matchesSearch && matchesCode;
      });

      if (activeSortKey) {
        filtered.sort((a, b) => {
          let valA = a[activeSortKey] || '';
          let valB = b[activeSortKey] || '';
          if (!isNaN(valA) && !isNaN(valB)) {
            valA = Number(valA);
            valB = Number(valB);
          }
          if (valA < valB) return activeSortAsc ? -1 : 1;
          if (valA > valB) return activeSortAsc ? 1 : -1;
          return 0;
        });
      }

      document.getElementById('vehicle-count').innerText = filtered.length;
      tbody.innerHTML = '';

      filtered.forEach((vehicle, idx) => {
        let tagClass = 'bg-slate-800/80 text-slate-400 border-slate-700';
        if (vehicle.code === 'Needs Inspection') tagClass = 'bg-rose-950/60 text-rose-300 border-rose-800/60';
        if (vehicle.code === 'Pending Review') tagClass = 'bg-amber-950/60 text-amber-300 border-amber-800/60';
        if (vehicle.code === 'Priority Lead') tagClass = 'bg-purple-950/60 text-purple-300 border-purple-800/60';
        if (vehicle.code === 'Hold') tagClass = 'bg-blue-950/60 text-blue-300 border-blue-800/60';

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-800/40 transition";
        tr.innerHTML = `
          <td class="py-3 px-4 text-center font-mono text-slate-500">${vehicle.originalIndex || (idx + 1)}</td>
          <td class="py-3 px-4 font-mono font-bold text-blue-400">${vehicle.stockNum}</td>
          <td class="py-3 px-4 font-bold text-slate-200">${vehicle.year}</td>
          <td class="py-3 px-4">
            <div class="font-bold text-slate-100">${vehicle.vehicleDescription}</div>
            <div class="text-[11px] text-slate-400 flex items-center gap-2 mt-0.5">
              <span>Color: <strong class="text-slate-300">${vehicle.color}</strong></span>
              ${vehicle.comments ? `<span class="text-amber-400/90 italic truncate max-w-md"><i class="fa-regular fa-comment ml-1 mr-0.5"></i> ${vehicle.comments}</span>` : ''}
            </div>
          </td>
          <td class="py-3 px-4 font-mono text-slate-300">${vehicle.lastScanLocation}</td>
          <td class="py-3 px-4 text-[11px] text-slate-400 max-w-[160px] truncate">${vehicle.zoneDescription}</td>
          <td class="py-3 px-4 font-mono text-[11px] text-slate-400 tracking-wider">${vehicle.vin}</td>
          <td class="py-3 px-4">
            <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[10px] px-2 py-0.5 rounded font-semibold tracking-wide">
              ${vehicle.productStatus}
            </span>
          </td>
          <td class="py-3 px-4">
            <span class="text-[11px] font-semibold px-2.5 py-1 rounded-md border inline-block ${tagClass}">
              ${vehicle.code || 'Unassigned'}
            </span>
          </td>
          <td class="py-3 px-4 text-[11px] text-slate-400 font-mono">${vehicle.modifiedDate || ''}</td>
          <td class="py-3 px-4 text-center">
            <button onclick="openEditModal('${vehicle.stockNum}')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1 rounded text-xs flex items-center gap-1 mx-auto transition">
              <i class="fa-solid fa-pen text-[10px]"></i> Edit
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Table Header Sorting
    function sortTable(key) {
      if (activeSortKey === key) {
        activeSortAsc = !activeSortAsc;
      } else {
        activeSortKey = key;
        activeSortAsc = true;
      }
      document.getElementById('sort-indicator').innerText = `Sort: ${key} (${activeSortAsc ? 'Asc' : 'Desc'})`;
      renderTable();
    }

    function resetOrder() {
      activeSortKey = null;
      activeSortAsc = true;
      vehiclesState.sort((a, b) => a.originalIndex - b.originalIndex);
      document.getElementById('sort-indicator').innerText = "Sort: Original Order";
      renderTable();
    }

    function resetData() {
      if (confirm("Reset all vehicle research notes to default v1.7.4 state?")) {
        vehiclesState = JSON.parse(JSON.stringify(seedDataset.vehicles));
        saveLocalCache();
        resetOrder();
      }
    }

    // Modal Control
    function openEditModal(stockNum) {
      activeEditingStockNum = stockNum;
      const vehicle = vehiclesState.find(v => String(v.stockNum) === String(stockNum));
      if (vehicle) {
        document.getElementById('modal-vehicle-title').innerText = `${vehicle.year} ${vehicle.vehicleDescription}`;
        document.getElementById('modal-stock-num').innerText = `Stock #${vehicle.stockNum} | VIN: ${vehicle.vin}`;
        document.getElementById('modal-comments').value = vehicle.comments || '';
        document.getElementById('modal-code').value = vehicle.code || 'Unassigned';
        document.getElementById('edit-modal').classList.remove('hidden');
      }
    }

    function closeEditModal() {
      activeEditingStockNum = null;
      document.getElementById('edit-modal').classList.add('hidden');
    }

    // Save Research Notes & Cloud Persistence
    function saveVehicleNotes() {
      if (!activeEditingStockNum) return;

      const vehicle = vehiclesState.find(v => String(v.stockNum) === String(activeEditingStockNum));
      if (vehicle) {
        const newComments = document.getElementById('modal-comments').value.trim();
        const newCode = document.getElementById('modal-code').value;

        const now = new Date();
        const formattedDate = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + 
                              now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

        vehicle.comments = newComments;
        vehicle.code = newCode;
        vehicle.modifiedDate = formattedDate;

        saveLocalCache();

        if (db) {
          db.collection("vehicles").doc(String(vehicle.stockNum)).set({
            stockNum: String(vehicle.stockNum),
            comments: newComments,
            code: newCode,
            modifiedDate: formattedDate,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true }).catch(err => console.error("Firestore Save Error:", err));
        }

        renderTable();
        closeEditModal();
      }
    }

    // Export JSON Payload
    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
        tags: seedDataset.tags,
        vehicles: vehiclesState
      }, null, 2));
      const downloadAnchor = document.createElement('a');
      const dateTag = new Date().toISOString().split('T')[0];
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `carmax_vehicle_research_v1.8.3_${dateTag}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // Event Listeners
    document.getElementById('search-input').addEventListener('input', renderTable);
    document.getElementById('code-filter').addEventListener('change', renderTable);

    // Initial Launch
    window.addEventListener('DOMContentLoaded', initDataStore);
  </script>
