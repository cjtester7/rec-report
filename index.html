<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarMax Vehicle Research Hub v1.8.2</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase v10 Compat SDKs (App & Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans pb-12">

  <!-- Header Section -->
  <header class="bg-slate-900 text-white shadow-lg py-6 px-4 sm:px-8 mb-8 border-b-4 border-blue-600">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight flex items-center gap-3">
          <i class="fa-solid font-bold text-blue-400 fa-car"></i> CarMax Vehicle Research Hub
          <span class="bg-blue-600 text-xs px-2.5 py-1 rounded-full font-mono font-medium">v1.8.2</span>
        </h1>
        <p class="text-slate-400 text-sm mt-1">Track, filter, and add personalized notes to target inventory.</p>
      </div>
      
      <!-- Realtime Database Status Badge -->
      <div id="sync-status" class="flex items-center gap-2 text-xs bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse" id="status-indicator"></span>
        <span id="status-text" class="text-slate-300 font-medium">Initializing Connection...</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-8">

    <!-- Filter and Search Bar -->
    <div class="bg-white p-5 rounded-xl shadow-md border border-gray-200 mb-8">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        
        <!-- Search Input -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Search</label>
          <div class="relative">
            <input type="text" id="search-input" placeholder="Make, model, stock #..." class="w-full pl-9 pr-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <i class="fa-solid fa-search absolute left-3 top-2.5 text-gray-400 text-sm"></i>
          </div>
        </div>

        <!-- Filter by Tag / Code -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Filter Tag</label>
          <select id="code-filter" class="w-full py-2 px-3 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option value="ALL">All Tags</option>
            <option value="FAVORITE">⭐ Favorite</option>
            <option value="REVIEW">👀 Needs Review</option>
            <option value="REJECT">❌ Rejected</option>
            <option value="BUY">🛒 Ready to Buy</option>
            <option value="UNTAGGED">Untagged Only</option>
          </select>
        </div>

        <!-- Sort By -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Sort By</label>
          <select id="sort-filter" class="w-full py-2 px-3 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="year-desc">Year: Newest First</option>
            <option value="mileage-asc">Mileage: Lowest First</option>
          </select>
        </div>

        <!-- Summary Stats -->
        <div class="flex items-center justify-between sm:justify-end gap-4 bg-slate-50 p-3 rounded-lg border border-slate-100">
          <div class="text-right">
            <span class="block text-xs text-gray-500 font-semibold">Total Displayed</span>
            <span id="vehicle-count" class="text-xl font-bold text-slate-800">0</span>
          </div>
        </div>

      </div>
    </div>

    <!-- Vehicles Grid Container -->
    <div id="vehicles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Dynamic Vehicle Cards render here -->
    </div>

    <!-- Empty State Container -->
    <div id="empty-state" class="hidden text-center py-16 bg-white rounded-xl border border-dashed border-gray-300 my-8">
      <i class="fa-solid fa-car-side text-4xl text-gray-300 mb-3"></i>
      <h3 class="text-lg font-semibold text-gray-700">No Vehicles Match Your Criteria</h3>
      <p class="text-sm text-gray-500 mt-1">Try resetting your filters or clearing your search term.</p>
    </div>

  </main>

  <!-- Vehicle Note & Tag Edit Modal -->
  <div id="edit-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full overflow-hidden border border-gray-100 transform transition-all">
      <div class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
        <h3 class="font-bold text-lg flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-blue-400"></i> Edit Vehicle Research Notes
        </h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="p-6 space-y-4">
        <div>
          <p id="modal-vehicle-title" class="font-bold text-gray-800 text-lg"></p>
          <p id="modal-stock-num" class="text-xs font-mono text-gray-500"></p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Tag Status</label>
          <select id="modal-code" class="w-full py-2 px-3 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">No Tag (Default)</option>
            <option value="FAVORITE">⭐ Favorite</option>
            <option value="REVIEW">👀 Needs Review</option>
            <option value="REJECT">❌ Rejected</option>
            <option value="BUY">🛒 Ready to Buy</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Personal Research Notes</label>
          <textarea id="modal-comments" rows="4" placeholder="Enter trim details, inspection notes, pricing comments..." class="w-full p-3 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
      </div>

      <div class="bg-gray-50 px-6 py-3 flex justify-end gap-3 border-t border-gray-100">
        <button onclick="closeEditModal()" class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-800 transition">Cancel</button>
        <button onclick="saveVehicleNotes()" class="px-4 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-sm transition">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // FIREBASE INITIALIZATION CONFIGURATION
    const firebaseConfig = {
      apiKey: "YOUR_ACTUAL_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch (e) {
      console.warn("Firebase config not fully configured. Defaulting local fallback mode.", e);
    }

    // Default Seed Data
    const seedVehicles = [
      { stockNum: "214589", year: 2021, make: "Toyota", model: "RAV4 XLE", price: 24998, mileage: 34200, location: "Baltimore, MD", comments: "", code: "" },
      { stockNum: "220194", year: 2020, make: "Honda", model: "CR-V EX-L", price: 23599, mileage: 41000, location: "Laurel, MD", comments: "", code: "" },
      { stockNum: "238910", year: 2022, make: "Mazda", model: "CX-5 Touring", price: 25499, mileage: 22100, location: "Elkridge, MD", comments: "", code: "" }
    ];

    let vehiclesState = [];
    let activeEditingStockNum = null;

    // DATA INITIALIZATION & HYBRID REAL-TIME SYNC
    function initDataStore() {
      const localData = localStorage.getItem('carmax_research_vehicles_v1.8');
      vehiclesState = localData ? JSON.parse(localData) : seedVehicles;

      if (db) {
        db.collection("vehicles").onSnapshot((snapshot) => {
          document.getElementById('status-indicator').className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
          document.getElementById('status-text').innerText = "Live Cloud Sync Active";

          if (!snapshot.empty) {
            const remoteMap = new Map();
            snapshot.forEach((doc) => {
              remoteMap.set(doc.id, doc.data());
            });

            // Merge existing local items with incoming Firestore items
            let updatedList = [...vehiclesState];

            remoteMap.forEach((remoteData, docId) => {
              const localIndex = updatedList.findIndex(v => String(v.stockNum) === String(docId));
              if (localIndex !== -1) {
                // Update local document fields safely
                updatedList[localIndex] = {
                  ...updatedList[localIndex],
                  ...remoteData,
                  stockNum: docId
                };
              } else {
                // If document exists remotely but not locally, create safe complete object
                updatedList.push({
                  stockNum: docId,
                  year: remoteData.year || 2021,
                  make: remoteData.make || 'CarMax',
                  model: remoteData.model || `Vehicle #${docId}`,
                  price: remoteData.price || 0,
                  mileage: remoteData.mileage || 0,
                  location: remoteData.location || 'Inventory',
                  comments: remoteData.comments || '',
                  code: remoteData.code || '',
                  modifiedDate: remoteData.modifiedDate || ''
                });
              }
            });

            vehiclesState = updatedList;
            localStorage.setItem('carmax_research_vehicles_v1.8', JSON.stringify(vehiclesState));
            applyFiltersAndSort();
          }
        }, (error) => {
          console.error("Firestore Listener Error:", error);
          document.getElementById('status-indicator').className = "w-2.5 h-2.5 rounded-full bg-amber-500";
          document.getElementById('status-text').innerText = "Local Cache Mode";
        });
      } else {
        document.getElementById('status-indicator').className = "w-2.5 h-2.5 rounded-full bg-amber-500";
        document.getElementById('status-text').innerText = "Local Cache Mode";
      }

      applyFiltersAndSort();
    }

    // UI RENDER METHOD WITH SAFE PROPERTY FALLBACKS
    function renderVehicles(vehicles) {
      const grid = document.getElementById('vehicles-grid');
      const emptyState = document.getElementById('empty-state');
      document.getElementById('vehicle-count').innerText = vehicles.length;

      grid.innerHTML = '';

      if (vehicles.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      vehicles.forEach(vehicle => {
        // Safe fallbacks to prevent undefined JS rendering bugs
        const year = vehicle.year || '2021';
        const make = vehicle.make || 'CarMax';
        const model = vehicle.model || `Vehicle #${vehicle.stockNum}`;
        const price = Number(vehicle.price || 0).toLocaleString();
        const mileage = Number(vehicle.mileage || 0).toLocaleString();
        const location = vehicle.location || 'Available';

        let tagBadge = '';
        switch(vehicle.code) {
          case 'FAVORITE':
            tagBadge = '<span class="bg-amber-100 text-amber-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-amber-300">⭐ Favorite</span>';
            break;
          case 'REVIEW':
            tagBadge = '<span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-blue-300">👀 Needs Review</span>';
            break;
          case 'REJECT':
            tagBadge = '<span class="bg-red-100 text-red-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-red-300">❌ Rejected</span>';
            break;
          case 'BUY':
            tagBadge = '<span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-emerald-300">🛒 Ready to Buy</span>';
            break;
        }

        const card = document.createElement('div');
        card.className = "bg-white rounded-xl shadow-sm hover:shadow-md transition border border-gray-200 flex flex-col justify-between overflow-hidden";
        card.innerHTML = `
          <div class="p-5">
            <div class="flex justify-between items-start gap-2 mb-2">
              <h2 class="font-bold text-lg text-slate-800 tracking-tight">${year} ${make} ${model}</h2>
              <div>${tagBadge}</div>
            </div>
            
            <div class="flex justify-between items-baseline mb-4">
              <span class="text-2xl font-extrabold text-blue-600">$${price}</span>
              <span class="text-xs font-medium text-gray-500">${mileage} miles</span>
            </div>

            <div class="text-xs text-gray-500 mb-4 flex items-center gap-4">
              <span><i class="fa-solid fa-location-dot mr-1"></i> ${location}</span>
              <span><i class="fa-solid fa-barcode mr-1"></i> #${vehicle.stockNum}</span>
            </div>

            <div class="bg-gray-50 p-3 rounded-lg border border-gray-100 min-h-[4rem]">
              <p class="text-xs font-semibold text-gray-500 uppercase mb-1">Notes</p>
              <p class="text-xs text-gray-700 italic">${vehicle.comments ? vehicle.comments : 'No comments added yet...'}</p>
              ${vehicle.modifiedDate ? `<p class="text-[10px] text-gray-400 mt-2 text-right">Updated: ${vehicle.modifiedDate}</p>` : ''}
            </div>
          </div>

          <div class="bg-slate-50 px-5 py-3 border-t border-gray-100 flex justify-end">
            <button onclick="openEditModal('${vehicle.stockNum}')" class="text-xs font-semibold text-blue-600 hover:text-blue-800 flex items-center gap-1.5 transition">
              <i class="fa-solid fa-pen"></i> Edit Notes & Tag
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // FILTER & SORT LOGIC
    function applyFiltersAndSort() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const codeFilter = document.getElementById('code-filter').value;
      const sortFilter = document.getElementById('sort-filter').value;

      let filtered = vehiclesState.filter(vehicle => {
        const matchesSearch = `${vehicle.year || ''} ${vehicle.make || ''} ${vehicle.model || ''} ${vehicle.stockNum}`.toLowerCase().includes(searchTerm);
        
        let matchesCode = true;
        if (codeFilter === 'UNTAGGED') {
          matchesCode = !vehicle.code;
        } else if (codeFilter !== 'ALL') {
          matchesCode = vehicle.code === codeFilter;
        }

        return matchesSearch && matchesCode;
      });

      filtered.sort((a, b) => {
        const priceA = Number(a.price) || 0;
        const priceB = Number(b.price) || 0;
        const yearA = Number(a.year) || 0;
        const yearB = Number(b.year) || 0;
        const mileageA = Number(a.mileage) || 0;
        const mileageB = Number(b.mileage) || 0;

        if (sortFilter === 'price-asc') return priceA - priceB;
        if (sortFilter === 'price-desc') return priceB - priceA;
        if (sortFilter === 'year-desc') return yearB - yearA;
        if (sortFilter === 'mileage-asc') return mileageA - mileageB;
        return 0;
      });

      renderVehicles(filtered);
    }

    // MODAL CONTROL
    function openEditModal(stockNum) {
      activeEditingStockNum = stockNum;
      const vehicle = vehiclesState.find(v => String(v.stockNum) === String(stockNum));
      if (vehicle) {
        document.getElementById('modal-vehicle-title').innerText = `${vehicle.year || ''} ${vehicle.make || 'Vehicle'} ${vehicle.model || ''}`;
        document.getElementById('modal-stock-num').innerText = `Stock #${vehicle.stockNum}`;
        document.getElementById('modal-comments').value = vehicle.comments || '';
        document.getElementById('modal-code').value = vehicle.code || '';
        document.getElementById('edit-modal').classList.remove('hidden');
      }
    }

    function closeEditModal() {
      activeEditingStockNum = null;
      document.getElementById('edit-modal').classList.add('hidden');
    }

    // SAVE VEHICLE NOTES & FULL ATTRIBUTES TO FIRESTORE & LOCAL STORAGE
    function saveVehicleNotes() {
      if (!activeEditingStockNum) return;

      const vehicle = vehiclesState.find(v => String(v.stockNum) === String(activeEditingStockNum));
      if (vehicle) {
        const newComments = document.getElementById('modal-comments').value.trim();
        const newCode = document.getElementById('modal-code').value;

        const now = new Date();
        const formattedDate = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + 
                              now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

        vehicle.comments = newComments;
        vehicle.code = newCode;
        vehicle.modifiedDate = formattedDate;

        // 1. Update Local Cache
        localStorage.setItem('carmax_research_vehicles_v1.8', JSON.stringify(vehiclesState));

        // 2. Persist to Cloud Firestore with full record payload
        if (db) {
          db.collection("vehicles").doc(String(vehicle.stockNum)).set({
            stockNum: String(vehicle.stockNum),
            year: vehicle.year || 2021,
            make: vehicle.make || 'CarMax',
            model: vehicle.model || 'Vehicle',
            price: vehicle.price || 0,
            mileage: vehicle.mileage || 0,
            location: vehicle.location || 'Available',
            comments: newComments,
            code: newCode,
            modifiedDate: formattedDate,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true })
          .then(() => {
            console.log(`Document #${vehicle.stockNum} synced successfully.`);
          })
          .catch((error) => {
            console.error("Firestore Write Error: ", error);
          });
        }

        applyFiltersAndSort();
        closeEditModal();
      }
    }

    // EVENT LISTENERS
    document.getElementById('search-input').addEventListener('input', applyFiltersAndSort);
    document.getElementById('code-filter').addEventListener('change', applyFiltersAndSort);
    document.getElementById('sort-filter').addEventListener('change', applyFiltersAndSort);

    // INIT ON LOAD
    window.addEventListener('DOMContentLoaded', initDataStore);
  </script>
</body>
</html>
